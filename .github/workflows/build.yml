name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (Release)
        run: dotnet build src/SshTunnelToolbox.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: SshTunnelToolbox
          path: src/bin/Release/net472/SshTunnelToolbox.exe
